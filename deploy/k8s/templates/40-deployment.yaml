# 40-deployment.yaml
#
# Production deployment. Notable choices:
#   - runAsNonRoot + readOnlyRootFilesystem (PSS "restricted")
#   - startupProbe gives the process up to 5 minutes to become ready
#     so slow DB migrations or first-time upstream TLS handshakes do
#     not get killed by liveness
#   - preStop sleep gives in-flight HTTP requests time to drain after
#     SIGTERM (Fastify's installGracefulShutdown handles the rest)
#   - /tmp mounted as emptyDir because Node occasionally needs a
#     writable tmpdir (heap dumps, large buffers) and the root FS is
#     read-only
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aide
  namespace: aide
  labels:
    app.kubernetes.io/name: aide
    app.kubernetes.io/instance: aide
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: aide
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aide
      app.kubernetes.io/instance: aide
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aide
        app.kubernetes.io/instance: aide
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: aide
        app.kubernetes.io/version: "1.0.0"
      annotations:
        # Force a rolling restart whenever the ConfigMap changes.
        # Ref: https://kubernetes.io/docs/concepts/cluster-administration/configuration/#configmap-rollout
        checksum/config: abcd1234 # kustomize replaces this
    spec:
      serviceAccountName: aide
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # must match Dockerfile USER node
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aide
          image: ghcr.io/ldkong2077/aide-monorepo:1.0.0 # kustomize replaces tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9900
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aide-config
            - secretRef:
                name: aide-secrets
                # If the secret is not materialised yet (sealed-secrets
                # controller hasn't synced), do NOT crash the pod —
                # fall back to whatever the ConfigMap provides.
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60 # 5 minutes total
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          lifecycle:
            preStop:
              # WHY: Give Kubernetes time to remove us from the Service
              # endpoints (1-2s) plus a few seconds for the proxy to
              # drain in-flight requests. installGracefulShutdown
              # handles the actual SIGTERM signal, but the kubelet
              # sends it AS SOON AS the preStop hook returns, so we
              # sleep here first.
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
      terminationGracePeriodSeconds: 45 # > preStop 15s + drain 30s
