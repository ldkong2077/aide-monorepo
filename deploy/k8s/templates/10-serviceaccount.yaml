# 10-serviceaccount.yaml
# WHY: dedicated SA + automountServiceAccountToken: false so the pod
# cannot reach the Kubernetes API unless we explicitly mount a token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aide
  namespace: aide
  labels:
    app.kubernetes.io/name: aide
    app.kubernetes.io/instance: aide
    app.kubernetes.io/component: service-account
    app.kubernetes.io/part-of: aide
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
