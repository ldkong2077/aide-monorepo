# nginx.example.conf — reverse-proxy example for the AIDE proxy.
#
# Replace `aide.example.com` with your hostname. Use Let's Encrypt
# (certbot) or your own CA to materialise the certificate. The
# `ssl_certificate` lines below use the snakeoil certs shipped with
# Debian/Ubuntu so the file parses out of the box for local testing.
#
# Place this file at /etc/nginx/sites-available/aide and symlink to
# sites-enabled. Reload with `nginx -s reload` or `systemctl reload
# nginx`.

# ─── Upstream block ──────────────────────────────────────────────────
upstream aide_upstream {
    server 127.0.0.1:9900;
    keepalive 16;
    keepalive_timeout 60s;
}

# ─── 80 → 443 redirect ───────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name aide.example.com;            # <-- replace

    # ACME http-01 challenge path — keep this if you use certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── TLS terminator ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aide.example.com;            # <-- replace

    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    # In production, replace the two lines above with:
    #   ssl_certificate     /etc/letsencrypt/live/aide.example.com/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/aide.example.com/privkey.pem;
    # and run `certbot --nginx -d aide.example.com`.

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: 2 years, include subdomains, preload-ready.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # CSP: very strict; the proxy is API-only, no scripts.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Streaming-friendly body size. Chat completions with large system
    # prompts can exceed nginx's default 1 MiB.
    client_max_body_size 2m;

    location / {
        proxy_pass http://aide_upstream;
        proxy_http_version 1.1;
        # Clear the Connection header so the upstream sees
        # "Connection: close" or nothing — we want keepalive
        # controlled by the `keepalive` directive in the upstream
        # block, not by a forwarded Connection: keep-alive.
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward the X-Request-Id supplied by the client if any.
        # The proxy itself will accept and use it (with a 200-char
        # DoS cap), or generate its own otherwise.
        proxy_set_header X-Request-Id      $http_x_request_id;

        # SSE / streaming-friendly timeouts. The proxy's upstream
        # timeout is 60s by default, but long-running model streams
        # can take several minutes for the first byte on slow models.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Optional: a status endpoint for nginx itself.
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny  all;
    }
}
