name: CodeQL

# Static analysis with GitHub CodeQL. Runs on every push to main, every
# PR, and weekly on Monday morning to catch newly disclosed patterns.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Monday 06:17 UTC

# CodeQL uploads results to the Security tab and (optionally) fails
# the build. We grant only the permissions it actually needs.
permissions:
  security-events: write
  contents: read
  actions: read
  pull-requests: read

# Cancel in-flight PR analyses (cheap) but never cancel main runs
# (we want a fresh weekly scan to complete).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: typescript
            build-mode: none # autobuild is unreliable on monorepos
          - language: javascript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We don't need the full history; shallow clone is faster and
          # CodeQL only diffs the working tree.
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # No `autobuild` step on purpose: monorepos confuse it. The
      # `build-mode: none` setting means CodeQL analyses the source
      # as-is, which is what we want for an ESM TypeScript codebase.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
