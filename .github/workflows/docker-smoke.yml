name: e2e smoke

# End-to-end smoke test for the Docker image.
#
# Builds the image, starts the proxy in the background, hits
# `/health`, `/readyz`, and `/metrics`, then tears it down.
# Catches regressions in the Dockerfile, the CLI entry point,
# the proxy's HTTP wiring, and the Prometheus surface.

on:
  push:
    branches: [main]
    paths:
      - "deploy/docker/**"
      - "packages/cli/**"
      - "packages/guard/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "deploy/docker/**"
      - "packages/cli/**"
      - "packages/guard/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Docker e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the AIDE image
        # Build the production multi-stage image exactly as a
        # `docker compose up` user would, but tag it locally so we
        # can reference it from the smoke test.
        working-directory: deploy/docker
        run: docker buildx build --load -t aide:smoke -f Dockerfile ../..

      - name: Start the proxy
        # Run the built image directly — no docker-compose here, we
        # only need the one service and the env file pattern is
        # simpler without it. Port 9900 is published so the smoke
        # test can curl it.
        run: |
          set -euo pipefail
          docker run -d --name aide-smoke \
            -p 9900:9900 \
            -e NODE_ENV=production \
            -e LOG_FORMAT=json \
            -e AIDE_TOKEN=smoke-test-token \
            aide:smoke
          echo "Container started, waiting for the server to come up…"

      - name: Wait for /health to return 200
        # Loop until the proxy is ready, or fail the job after 60 s.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9900/health >/dev/null 2>&1; then
              echo "Health check passed after ${i} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "Health check did not pass within 60s"
          docker logs aide-smoke
          exit 1

      - name: Probe /readyz
        run: |
          set -euo pipefail
          body=$(curl -fsS http://localhost:9900/readyz)
          echo "Readyz response: $body"
          echo "$body" | grep -q '"ready":true'

      - name: Probe /metrics
        # /metrics must:
        #   - return 200 without auth (the endpoint is public)
        #   - carry a Prometheus content type
        #   - contain the eight aide_* custom metrics
        run: |
          set -euo pipefail
          headers=$(curl -fsS -D - -o /tmp/metrics http://localhost:9900/metrics)
          echo "$headers" | head -20
          echo "$headers" | grep -iq '^content-type:.*text/plain'
          for metric in \
            aide_http_requests_total \
            aide_http_request_duration_seconds \
            aide_http_requests_in_flight \
            aide_upstream_requests_total \
            aide_upstream_request_duration_seconds \
            aide_rate_limit_rejections_total \
            aide_auth_failures_total \
            aide_ready_state; do
            if ! grep -q "^# HELP ${metric} " /tmp/metrics; then
              echo "Missing metric: ${metric}"
              exit 1
            fi
            echo "OK: ${metric}"
          done

      - name: Probe Bearer-token gate (no token → 401, with token → past gate)
        run: |
          set -euo pipefail
          unauth=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9900/v1/models)
          echo "Unauth /v1/models → HTTP $unauth"
          [ "$unauth" = "401" ]
          auth=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer smoke-test-token" http://localhost:9900/v1/models)
          echo "Authed /v1/models → HTTP $auth"
          # The authed request will fail later in the pipeline (no
          # providers configured), but it MUST NOT 401.
          [ "$auth" != "401" ]

      - name: Probe rate-limit headers
        run: |
          set -euo pipefail
          headers=$(curl -fsS -D - -o /dev/null \
            -H "Authorization: Bearer smoke-test-token" \
            http://localhost:9900/v1/models)
          echo "$headers" | head -20
          # X-RateLimit-Limit and X-RateLimit-Remaining should be
          # set on every authenticated response.
          echo "$headers" | grep -iq '^x-ratelimit-limit:'
          echo "$headers" | grep -iq '^x-ratelimit-remaining:'

      - name: Probe security headers
        run: |
          set -euo pipefail
          headers=$(curl -fsS -D - -o /dev/null http://localhost:9900/health)
          echo "$headers" | grep -iq '^x-content-type-options:[[:space:]]*nosniff'
          echo "$headers" | grep -iq '^x-frame-options:[[:space:]]*DENY'
          echo "$headers" | grep -iq '^referrer-policy:[[:space:]]*no-referrer'
          echo "$headers" | grep -iq '^x-request-id:'

      - name: Stop the container
        if: always()
        run: docker rm -f aide-smoke || true

      - name: Upload container logs on failure
        if: failure()
        run: |
          mkdir -p smoke-logs
          docker logs aide-smoke > smoke-logs/aide.log 2>&1 || true
          docker inspect aide-smoke > smoke-logs/inspect.json 2>&1 || true
        # The artifact is collected below.

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke-logs/
          retention-days: 7
