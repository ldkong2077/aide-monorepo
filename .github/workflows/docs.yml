name: Deploy API docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/core/src/**/*.ts"
      - "packages/guard/src/**/*.ts"
      - "typedoc.json"
      - "tsconfig.typedoc.json"
  workflow_dispatch:

# Re-deploys on every push to main that touches source. Manual
# dispatch is allowed for ad-hoc re-runs (e.g. when the
# `github-pages` environment is misconfigured).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

# Restrict to GitHub Pages environment so the deployment is gated
# by the repo's environment protection rules.
environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

jobs:
  build:
    name: Build API docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build packages (so .d.ts files exist for cross-package references)
        run: npm run build

      - name: Generate TypeDoc HTML
        run: npm run docs

      - name: Copy non-API docs alongside
        run: |
          # The TypeDoc output is at docs/api/. Copy the human-facing
          # docs/architecture.md and docs/security.md so they're
          # served at the same origin and the navigation links work.
          mkdir -p docs/_site
          cp -r docs/api/* docs/_site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
