# 70-hpa.yaml
# WHY: CPU-only scaling is brittle for an LLM proxy (CPU is mostly
# idle while waiting for upstream). Memory + CPU together give a
# better signal — memory growth tracks per-request buffers, and CPU
# tracks the proxy's own work (JSON parse, route evaluation).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aide
  namespace: aide
  labels:
    app.kubernetes.io/name: aide
    app.kubernetes.io/instance: aide
    app.kubernetes.io/component: autoscaler
    app.kubernetes.io/part-of: aide
    app.kubernetes.io/managed-by: kustomize
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aide
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300      # 5 min — avoid flapping
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
