# 60-ingress.yaml
#
# WHY: nginx ingress with explicit timeouts. Streaming responses
# (SSE) need 10 minutes of read/send timeout; non-streaming requests
# are bounded by the upstream 60s timeout.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aide
  namespace: aide
  labels:
    app.kubernetes.io/name: aide
    app.kubernetes.io/instance: aide
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: aide
    app.kubernetes.io/managed-by: kustomize
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Forward the X-Request-Id header set by the upstream; let the
    # proxy use its own if the client didn't set one.
    nginx.ingress.kubernetes.io/proxy-set-headers: |
      X-Forwarded-Proto: $scheme
      X-Forwarded-For: $remote_addr
    cert-manager.io/cluster-issuer: letsencrypt-prod      # optional, comment if not using cert-manager
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aide.example.com                              # <-- replace
      secretName: aide-tls
  rules:
    - host: aide.example.com                            # <-- replace
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aide
                port:
                  number: 9900
